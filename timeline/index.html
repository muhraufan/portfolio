  <script>
(function () {
  try {
    (function(){var KEY='light',STATES=['morning','midday','golden','night'],STARTS=[['morning',300],['midday',660],['golden',930],['night',1080]];var html=document.documentElement,dark=window.matchMedia('(prefers-color-scheme: dark)');function clock(d){d=d||new Date();var m=d.getHours()*60+d.getMinutes(),k='night',i;for(i=0;i<STARTS.length;i++)if(m>=STARTS[i][1])k=STARTS[i][0];return m<STARTS[0][1]?'night':k;}function choice(){try{var c=localStorage.getItem(KEY);if(STATES.indexOf(c)>=0)return c;if(!localStorage.getItem('light-migrated')){localStorage.setItem('light-migrated','1');if(localStorage.getItem('theme')==='dark'){localStorage.setItem(KEY,'night');return 'night';}}return 'auto';}catch(e){return 'auto';}}function override(){var o=new URLSearchParams(location.search).get('tod');return STATES.indexOf(o)>=0?o:null;}function resolve(c){var o=override();if(o)return o;c=c||choice();if(c!=='auto')return c;return dark.matches?'night':clock();}function apply(c){var s=resolve(c);html.setAttribute('data-tod',s);html.setAttribute('data-theme',s==='night'?'dark':'light');try{localStorage.setItem('theme',s==='night'?'dark':'light');}catch(e){}return s;}function set(c){try{if(c==='auto')localStorage.removeItem(KEY);else localStorage.setItem(KEY,c);}catch(e){}return apply(c);}var GREET={en:{morning:'Good morning',midday:'Good afternoon',golden:'Golden hour',night:'Good night'},ja:{morning:'\u304a\u306f\u3088\u3046',midday:'\u3053\u3093\u306b\u3061\u306f',golden:'\u5915\u66ae\u308c\u3069\u304d',night:'\u3053\u3093\u3070\u3093\u306f'}};function stamp(){var b=document.getElementById('pc-light-btn');if(!b)return;var d=new Date(),lang=html.getAttribute('data-lang')==='ja'?'ja':'en',now=html.getAttribute('data-tod')||'midday';var time=lang==='ja'?d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false}):d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});var te=b.querySelector('.pc-light-time'),ge=b.querySelector('.pc-light-greet');if(te){te.textContent=time;te.setAttribute('datetime',d.toTimeString().slice(0,5));}if(ge)ge.textContent=(GREET[lang]||GREET.en)[now]||'';}window.PCLight={STATES:STATES,clock:clock,choice:choice,override:override,resolve:resolve,apply:apply,set:set,dark:dark,stamp:stamp};apply();})();
    if (localStorage.getItem('lang') === 'ja') document.documentElement.setAttribute('data-lang', 'ja');
  } catch (e) {}
  window.__loadNotoSansJP = function () {
    if (window.__notoPromise) return window.__notoPromise;
    window.__notoPromise = new Promise(function (resolve) {
      var link = document.getElementById('noto-sans-jp');
      var finish = function () {
        if (document.fonts && document.fonts.load) {
          document.fonts.load('400 16px "Noto Sans JP"').then(function () { resolve(); }, function () { resolve(); });
        } else resolve();
      };
      if (!link) {
        var pre = document.createElement('link');
        pre.rel = 'preconnect';
        pre.href = 'https://fonts.gstatic.com';
        pre.crossOrigin = 'anonymous';
        document.head.appendChild(pre);
        link = document.createElement('link');
        link.id = 'noto-sans-jp';
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap';
        document.head.appendChild(link);
      }
      if (link.sheet) { finish(); return; }
      link.addEventListener('load', finish, { once: true });
      link.addEventListener('error', function () { resolve(); }, { once: true });
    });
    return window.__notoPromise;
  };
  try { if (localStorage.getItem('lang') === 'ja') window.__loadNotoSansJP(); } catch (e) {}
})();
</script>
