  <script>
    (function () {
      var theme = localStorage.getItem('theme') || 'light';
      var lang = localStorage.getItem('lang') || 'en';
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-lang', lang);
    })();
  </script>
  <link rel="stylesheet" href="/components/Stabilo/stabilo.css?v=6">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --text: #111111;
      --text2: rgba(17, 17, 17, 0.72);
      --text3: rgba(17, 17, 17, 0.45);
      --border: rgba(17, 17, 17, 0.1);
      --surface: rgba(255, 255, 255, 0.82);
      --ease-out: cubic-bezier(0.2, 0, 0, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-folder-open: linear(0, .027 4%, .097 8%, .195 12%, .307 16%, .424 20%, .539 24%, .646 28%, .742 32%, .825 36%, .895 40%, .95 44%, .994 48%, 1.025 52%, 1.047 56%, 1.06 60%, 1.067 64%, 1.068 68%, 1.065 72%, 1.06 76%, 1.053 80%, 1.04 84%, 1.027 88%, 1.015 92%, 1.006 96%, 1);
    }

    [data-theme="dark"] {
      --bg: #111111;
      --text: #f1efeb;
      --text2: rgba(241, 239, 235, 0.72);
      --text3: rgba(241, 239, 235, 0.46);
      --border: rgba(255, 255, 255, 0.12);
      --surface: rgba(27, 27, 27, 0.82);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111111;
        --text: #f1efeb;
        --text2: rgba(241, 239, 235, 0.72);
        --text3: rgba(241, 239, 235, 0.46);
        --border: rgba(255, 255, 255, 0.12);
        --surface: rgba(27, 27, 27, 0.82);
      }
    }

    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      transition: background 220ms var(--ease-out), color 220ms var(--ease-out);
    }

    html[data-lang="ja"] body { font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif; }

    :focus { outline: none; }
    :focus-visible { outline: 2px solid #0099ff; outline-offset: 3px; }

    .page-shell {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px 30px;
      transition: opacity 320ms var(--ease-out), transform 420ms var(--ease-in-out), filter 320ms var(--ease-out);
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      margin-bottom: 58px;
    }

    .page-controls { display: flex; align-items: center; gap: 8px; }

    .language-toggle,
    .theme-toggle {
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border: 0;
      background: transparent;
      color: var(--text3);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color 160ms ease, transform 140ms var(--ease-out);
    }

    .theme-toggle svg { position: absolute; width: 16px; height: 16px; }
    .theme-toggle .icon-sun,
    [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: scale(.25); filter: blur(4px); }
    .theme-toggle .icon-moon,
    [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: scale(1); filter: blur(0); }
    .theme-toggle svg { transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out), filter 300ms var(--ease-out); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { opacity: 0; transform: scale(.25); filter: blur(4px); }
      :root:not([data-theme="light"]) .theme-toggle .icon-sun { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .language-toggle:hover,
    .theme-toggle:hover { color: var(--text); }
    .language-toggle:active,
    .theme-toggle:active { transform: scale(.96); }

    /* ---- Header ---- */
    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 12px 24px;
    }
    .page-header h1 {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .page-header .count {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .04em;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .page-intro {
      grid-column: 1 / -1;
      max-width: 610px;
      margin-top: 10px;
      color: var(--text2);
      font-size: 17px;
      line-height: 1.8;
      letter-spacing: .035em;
      text-wrap: pretty;
    }

    .page-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 22px;
    }

    .shuffle-button {
      position: relative;
      min-height: 40px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 160ms ease, transform 140ms var(--ease-out);
    }
    .shuffle-button::after,
    .back-link::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 8px;
      left: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(.35);
      transform-origin: left;
      opacity: .35;
      transition: transform 220ms var(--ease-out), opacity 160ms ease;
    }
    .shuffle-button:hover::after,
    .back-link:hover::after { transform: scaleX(1); opacity: .75; }
    .shuffle-button:active { transform: scale(.96); }

    /* ---- Back link ---- */
    .back-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      color: var(--text3);
      font-size: 12px;
      font-weight: 400;
      text-decoration: none;
      transition: color 160ms ease, transform 140ms var(--ease-out);
    }
    .back-link:hover { color: var(--text); }
    .back-link:active { transform: scale(.96); }

    /* ---- Grid ---- */
    .gallery-grid {
      max-width: 1520px;
      margin: 0 auto;
      padding: 28px 32px 120px;
      display: grid;
      /* 6 cards/row on wide screens; auto-downshifts on smaller. */
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px 18px;
      perspective: 1600px;
    }

    /* ================================================================
       CARD
       ================================================================

       Base transform stack (applied at rest and during hover):
         perspective → rotateX → rotateY → scale → translateY → translateZ
       Each axis is driven by a CSS custom property so JS can update them
       independently: --rx, --ry from cursor position; --s, --ty, --tz
       flip between resting and active values via the .is-active class. */
    .gallery-card {
      position: relative;
      aspect-ratio: 1.586 / 1; /* credit-card ratio */
      border-radius: 18px;
      overflow: visible;
      transform-style: preserve-3d;
      transform:
        translate3d(var(--scatter-x, 0px), var(--scatter-y, 0px), 0)
        perspective(1600px)
        rotateX(var(--rx, 0deg))
        rotateY(var(--ry, 0deg))
        translateY(var(--ty, 0px))
        translateZ(var(--tz, 0px))
        scale(var(--s, 1));
      transform-origin: center center;
      /* Crisp contact shadow (close, dark, tight) + soft ambient — reads
         as a solid object with mass sitting on the surface. */
      box-shadow:
        0 1px 1px rgba(0, 0, 0, 0.10),
        0 2px 4px rgba(0, 0, 0, 0.08),
        0 8px 18px rgba(0, 0, 0, 0.06);
      /* Snappy return — a firm card doesn't wobble back into place. */
      transition:
        transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
      opacity: 1;
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      font: inherit;
      color: inherit;
    }
    /* During hover, shorten the transform transition so the tilt tracks
       the cursor without lag. box-shadow keeps its longer curve to grow
       in as the card lifts. */
    .gallery-card.is-active {
      /* 40ms linear tracking = tight, 1:1 with the cursor. Longer or eased
         transitions make the card feel like paper flexing behind the pointer. */
      transition:
        transform 40ms linear,
        box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      /* "Flying" feel: forward push (tz), small upward hop (ty),
         slight scale-up, much larger lift shadow. */
      --tz: 12px;
      --ty: -2px;
      --s: 1.01;
      /* Tight near-edge contact + broader ambient — reads as a solid
         object lifted just above the surface, not a floating sheet. */
      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.12),
        0 6px 12px rgba(0, 0, 0, 0.10),
        0 20px 32px rgba(0, 0, 0, 0.10);
      z-index: 5;
    }
    .gallery-card.is-new {
      animation: cardDealIn 520ms var(--ease-folder-open) both;
    }

    @keyframes cardDealIn {
      from { opacity: 0; transform: translate3d(32px, -24px, 0) rotate(2deg) scale(.96); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0) scale(1); }
    }

    .gallery-card.is-source { opacity: 0; pointer-events: none; }
    .gallery-card.is-scattered {
      opacity: .18;
      filter: blur(1px);
      pointer-events: none;
    }

    .watermelon-sticker {
      position: absolute;
      top: -4px;
      right: 18px;
      z-index: -1;
      font-size: 24px;
      line-height: 1;
      pointer-events: none;
      transform: translateY(-110%) rotate(10deg);
      opacity: 0;
      transition: transform 420ms var(--ease-folder-open), opacity 180ms ease;
    }
    .watermelon-sticker.is-peeking { transform: translateY(0) rotate(10deg); opacity: 1; }
    .gallery-card:has(.watermelon-sticker) { z-index: 4; }

    .gallery-card-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
    }

    .gallery-card-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      overflow: hidden;
      border-radius: inherit;
    }
    .gallery-card-pattern svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ================================================================
       SHINE — embedded in the card face, driven by tilt
       ================================================================

       Fix for the "cursor-attached" look: instead of a radial spotlight
       under the cursor, we use two broad gradient BANDS whose background-
       position slides as the card tilts. The viewer sees a sheen that
       lives on the card's surface and catches light based on viewing
       angle — not a flashlight attached to their mouse.

       Both layers are always mounted; opacity cross-fades via .is-active. */
    .gallery-card-shine,
    .gallery-card-holo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      border-radius: inherit;
      transition: opacity 320ms ease-out;
      /* Same sliding position for both — so the two layers reinforce
         each other as a single reflection rather than splitting. */
      background-position: var(--shine-px, 50%) var(--shine-py, 50%);
      background-size: 220% 220%;
    }
    .gallery-card-shine {
      /* Broad diagonal gloss band — the primary "this is a shiny surface"
         signal. Screen blend adds brightness without washing out color. */
      background-image: linear-gradient(
        125deg,
        transparent 36%,
        rgba(255, 255, 255, 0.14) 46%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.14) 54%,
        transparent 64%
      );
      mix-blend-mode: screen;
    }
    .gallery-card-holo {
      /* Subtle rainbow band offset from the gloss — gives the holographic
         foil look. Soft-light preserves the card color underneath. */
      background-image: linear-gradient(
        110deg,
        transparent 36%,
        rgba(255, 180, 220, 0.12) 44%,
        rgba(180, 220, 255, 0.12) 50%,
        rgba(255, 230, 170, 0.12) 56%,
        transparent 64%
      );
      background-size: 260% 260%;
      mix-blend-mode: soft-light;
    }
    .gallery-card.is-active .gallery-card-shine { opacity: 0.55; }
    .gallery-card.is-active .gallery-card-holo { opacity: 0.6; }

    .gallery-card-content {
      position: relative;
      z-index: 1;
      padding: 18px 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
      transform: translateZ(1px);
      overflow: hidden;
      border-radius: inherit;
    }

    .gallery-card-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--card-ink);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.005em;
    }

    .gallery-card-message {
      font-size: 13px;
      font-weight: 400;
      color: var(--card-ink);
      opacity: 0.78;
      line-height: 1.45;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-top: 2px;
    }

    /* Signature row — signature takes remaining width and a generous
       height, date stays compact on the right. */
    .gallery-card-footer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin-top: auto;
      padding-top: 10px;
    }
    .gallery-card-signature {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 52px;
      object-fit: contain;
      object-position: left bottom;
      opacity: 0.9;
    }
    .gallery-card-date {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--card-ink);
      opacity: 0.55;
      text-align: right;
      white-space: nowrap;
      padding-bottom: 2px;
    }

    /* ================================================================
       MODAL — click a card to enlarge it
       ================================================================ */
    .card-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      padding: 0;
      background: rgba(20, 18, 16, 0);
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 240ms var(--ease-out),
        background 280ms var(--ease-out),
        backdrop-filter 280ms var(--ease-out);
    }
    .card-modal.is-open {
      opacity: 1;
      pointer-events: auto;
      background: rgba(17, 17, 17, 0.38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card-modal.is-closing {
      opacity: 1;
      pointer-events: none;
      background: rgba(17, 17, 17, 0.24);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .card-modal-stage {
      position: fixed;
      perspective: 1800px;
      transform-origin: top left;
      transition: transform 440ms var(--ease-folder-open);
      will-change: transform;
      pointer-events: none;
    }
    /* Card inside modal: scale up proportionally, keep tilt/shine. */
    .card-modal .gallery-card {
      width: 100%;
      height: 100%;
      opacity: 1;
      animation: none;
      cursor: default;
      pointer-events: auto;
    }
    .card-modal .gallery-card-name { font-size: 22px; }
    .card-modal .gallery-card-message {
      font-size: 16px;
      line-height: 1.5;
      -webkit-line-clamp: 6;
    }
    .card-modal .gallery-card-signature { height: 90px; }
    .card-modal .gallery-card-date { font-size: 12px; }
    .card-modal .gallery-card-content { padding: 28px 32px; }
    .card-modal-close {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      cursor: pointer;
      transition: background 160ms ease-out, transform 140ms ease-out;
      font-size: 14px;
      pointer-events: auto;
    }
    .card-modal-close:hover { background: rgba(255, 255, 255, 0.22); }
    .card-modal-close:active { transform: scale(0.96); }

    body.has-card-open { overflow: hidden; }
    body.has-card-open .page-shell { opacity: .12; transform: translateY(-24px); filter: blur(1px); }

    .leave-card {
      position: relative;
      aspect-ratio: 1.586 / 1;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: var(--text3);
      box-shadow: inset 0 0 0 1px var(--border);
      text-decoration: none;
      font-size: 12px;
      transition: color 180ms ease, transform 180ms var(--ease-out), box-shadow 180ms ease;
    }
    .leave-card::before {
      content: '';
      position: absolute;
      inset: 9px;
      border-radius: 11px;
      border: 1px dashed var(--border);
    }
    .leave-card:hover { color: var(--text); transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(17,17,17,.18); }
    .leave-card:active { transform: scale(.96); }

    /* ---- Empty / loading states ---- */
    .status {
      grid-column: 1 / -1;
      padding: 80px 0;
      text-align: center;
      font-size: 14px;
      color: var(--text3);
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ---- Mobile ---- */
    @media (max-width: 640px) {
      .page-shell { padding: 28px 20px 20px; }
      .page-nav { margin-bottom: 44px; }
      .page-header { grid-template-columns: 1fr; }
      .page-header .count { text-align: left; }
      .page-intro { font-size: 15px; line-height: 1.75; }
      .gallery-grid {
        padding: 16px 20px 80px;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px 14px;
      }
      /* Tilt is jittery on touch — flatten it. */
      .gallery-card { --rx: 0deg !important; --ry: 0deg !important; }
      .gallery-card.is-active { --ty: -4px; --tz: 24px; --s: 1.03; }
      .card-modal-close { right: 12px; bottom: 12px; }
    }

    @media (hover: hover) and (pointer: fine) {
      .gallery-card { will-change: transform; }
      .gallery-card:hover { z-index: 5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-card,
      .gallery-card.is-active {
        transition: box-shadow 200ms ease-out;
        transform: none !important;
      }
      .gallery-card-shine,
      .gallery-card-holo { display: none; }
      .card-modal-stage { transform: none !important; }
      .gallery-card.is-scattered { opacity: .12; filter: none; }
      body.has-card-open .page-shell { transform: none; filter: none; }
    }
  </style>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://dbvaqcorhfqvyyvqyoql.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRidmFxY29yaGZxdnl5dnF5b3FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTE4MjEsImV4cCI6MjA5MTQyNzgyMX0.mDAK8f41sJVrnRx-h6Tqbw1RRUrEbWUIdlLThb_pSEk';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEFAULT_CARD_COLOR = '#E8541A';
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const countEl = document.getElementById('count');
    const modal = document.getElementById('modal');
    const modalStage = document.getElementById('modalStage');
    const modalClose = document.getElementById('modalClose');
    const shuffleButton = document.getElementById('shuffleButton');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
    let currentCount = 0;
    let activeSource = null;
    let savedScrollY = 0;
    let closeTimer = 0;

    function getLanguage() {
      return localStorage.getItem('lang') || 'en';
    }

    function updateCount(count = currentCount) {
      currentCount = count;
      const lang = getLanguage();
      countEl.textContent = lang === 'ja'
        ? `${count}人の来訪者から届いたカード`
        : `${count} ${count === 1 ? 'note' : 'notes'} from visitors`;
    }

    function applyLanguage(lang) {
      localStorage.setItem('lang', lang);
      document.documentElement.setAttribute('data-lang', lang);
      document.querySelectorAll('[data-en][data-ja]').forEach(element => {
        element.textContent = element.dataset[lang];
      });
      document.querySelector('.language-toggle').textContent = lang === 'ja' ? 'EN' : 'JA';
      grid.setAttribute('aria-label', lang === 'ja' ? '来訪者のカード' : 'Visitor cards');
      modalClose.setAttribute('aria-label', lang === 'ja' ? '閉じる' : 'Close');
      updateCount();
    }

    function applyTheme(theme) {
      localStorage.setItem('theme', theme);
      document.documentElement.setAttribute('data-theme', theme);
    }

    document.querySelector('.language-toggle').addEventListener('click', () => {
      applyLanguage(getLanguage() === 'ja' ? 'en' : 'ja');
    });

    document.querySelector('.theme-toggle').addEventListener('click', () => {
      const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    applyLanguage(getLanguage());

    // ---- Pattern SVG generator (mirrors GuestbookCard.js) ----
    let patternUid = 0;
    function createPatternSVG(key) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('xmlns', NS);
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.setAttribute('aria-hidden', 'true');

      const id = `gp-${key}-${++patternUid}`;
      const defs = document.createElementNS(NS, 'defs');
      const pat = document.createElementNS(NS, 'pattern');
      pat.setAttribute('id', id);
      pat.setAttribute('patternUnits', 'userSpaceOnUse');

      const addLine = (x1, y1, x2, y2, w = 1) => {
        const el = document.createElementNS(NS, 'line');
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x2); el.setAttribute('y2', y2);
        el.setAttribute('stroke', 'currentColor');
        el.setAttribute('stroke-width', w);
        el.setAttribute('stroke-linecap', 'round');
        pat.appendChild(el);
      };

      switch (key) {
        case 'dash-scatter':
          pat.setAttribute('width', '32'); pat.setAttribute('height', '22');
          addLine(4,12,12,6,1.5); addLine(20,14,28,8,1.5);
          addLine(14,2,22,-2,1.5); addLine(-2,2,6,-2,1.5);
          break;
        case 'dot-grid': {
          pat.setAttribute('width', '24'); pat.setAttribute('height', '24');
          const c = document.createElementNS(NS, 'circle');
          c.setAttribute('cx','12'); c.setAttribute('cy','12');
          c.setAttribute('r','2'); c.setAttribute('fill','currentColor');
          pat.appendChild(c);
          break;
        }
        case 'ruled':
          pat.setAttribute('width', '20'); pat.setAttribute('height', '20');
          addLine(0,10,20,10,1);
          break;
        case 'batik-kawung': {
          pat.setAttribute('width', '20'); pat.setAttribute('height', '20');
          [[10,3,3,5],[10,17,3,5],[3,10,5,3],[17,10,5,3]].forEach(([cx,cy,rx,ry]) => {
            const e = document.createElementNS(NS, 'ellipse');
            e.setAttribute('cx',cx); e.setAttribute('cy',cy);
            e.setAttribute('rx',rx); e.setAttribute('ry',ry);
            e.setAttribute('fill','none'); e.setAttribute('stroke','currentColor');
            e.setAttribute('stroke-width','0.9');
            pat.appendChild(e);
          });
          break;
        }
        case 'batik-parang': {
          pat.setAttribute('width', '16'); pat.setAttribute('height', '16');
          pat.setAttribute('patternTransform', 'rotate(-45)');
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', 'M8,0 C4,4 12,12 8,16');
          p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
          p.setAttribute('stroke-width', '1.3'); p.setAttribute('stroke-linecap', 'round');
          pat.appendChild(p);
          break;
        }
        default:
          return createPatternSVG('dash-scatter');
      }

      defs.appendChild(pat); svg.appendChild(defs);
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('width', '100%'); rect.setAttribute('height', '100%');
      rect.setAttribute('fill', `url(#${id})`);
      svg.appendChild(rect);
      return svg;
    }

    // ---- Contrast helpers ----
    function hexToL(hex) {
      const r = parseInt(hex.slice(1,3),16)/255;
      const g = parseInt(hex.slice(3,5),16)/255;
      const b = parseInt(hex.slice(5,7),16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      return (max+min)/2;
    }
    function getInkColor(bg) {
      return hexToL(bg || DEFAULT_CARD_COLOR) > 0.65 ? '#1a1a1a' : '#ffffff';
    }

    // ---- Build a card DOM element ----
    function buildCard(entry, { isNew = false, isModal = false } = {}) {
      const color = entry.card_color || DEFAULT_CARD_COLOR;
      const ink = getInkColor(color);

      const card = document.createElement(isModal ? 'div' : 'button');
      card.className = 'gallery-card' + (isNew ? ' is-new' : '');
      card.style.setProperty('--card-ink', ink);
      if (!isModal) {
        card.type = 'button';
        card.setAttribute('aria-label', `Open card from ${entry.name || 'Anonymous'}`);
      }

      const bg = document.createElement('div');
      bg.className = 'gallery-card-bg';
      bg.style.background = color;
      card.appendChild(bg);

      if (entry.pattern) {
        const patWrap = document.createElement('div');
        patWrap.className = 'gallery-card-pattern';
        patWrap.style.color = ink;
        patWrap.appendChild(createPatternSVG(entry.pattern));
        card.appendChild(patWrap);
      }

      // Shine layers — CSS does the look; JS updates --shine-px/py.
      const shine = document.createElement('div');
      shine.className = 'gallery-card-shine';
      card.appendChild(shine);

      const holo = document.createElement('div');
      holo.className = 'gallery-card-holo';
      card.appendChild(holo);

      const content = document.createElement('div');
      content.className = 'gallery-card-content';

      const name = document.createElement('div');
      name.className = 'gallery-card-name';
      name.textContent = entry.name || 'Anonymous';
      content.appendChild(name);

      if (entry.message) {
        const msg = document.createElement('div');
        msg.className = 'gallery-card-message';
        msg.textContent = entry.message;
        content.appendChild(msg);
      }

      const footer = document.createElement('div');
      footer.className = 'gallery-card-footer';

      if (entry.signature_data) {
        const sig = document.createElement('img');
        sig.className = 'gallery-card-signature';
        sig.src = entry.signature_data;
        sig.alt = '';
        sig.draggable = false;
        footer.appendChild(sig);
      } else {
        // Empty flex placeholder so date stays right-aligned.
        const spacer = document.createElement('span');
        spacer.style.flex = '1';
        footer.appendChild(spacer);
      }

      const date = document.createElement('div');
      date.className = 'gallery-card-date';
      const d = new Date(entry.created_at);
      date.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      footer.appendChild(date);

      content.appendChild(footer);
      card.appendChild(content);

      if (finePointer.matches) attachTilt(card);

      if (!isModal) {
        card.__entry = entry;
        card.addEventListener('click', () => openModal(entry, card));
      }

      return card;
    }

    // ---- Tilt + shine driven by cursor ----
    // We compute:
    //   x, y        — cursor position on card as 0..1 (left→right, top→bottom)
    //   --rx, --ry  — tilt degrees (max ±MAX_TILT)
    //   --shine-px,
    //   --shine-py  — background-position offsets for the shine bands,
    //                 so the reflection SLIDES across the card surface
    //                 as the angle changes (not a spotlight under the
    //                 cursor).
    function attachTilt(card) {
      const MAX_TILT = 4;

      function onMove(e) {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;   // 0..1
        const y = (e.clientY - rect.top) / rect.height;   // 0..1
        // Invert so the edge the cursor is over LIFTS toward the viewer:
        //   cursor on right → right edge up (rotateY negative)
        //   cursor on top   → top edge up   (rotateX positive with y-inverted)
        const ry = (0.5 - x) * 2 * MAX_TILT;              // left/right tilt
        const rx = (y - 0.5) * 2 * MAX_TILT;              // up/down tilt
        card.style.setProperty('--rx', `${rx}deg`);
        card.style.setProperty('--ry', `${ry}deg`);
        // Map 0..1 cursor → 100%..0% position, so light band sweeps
        // across the card face opposite to the cursor's movement —
        // mimicking how a physical reflection appears to slide against
        // your viewing direction.
        card.style.setProperty('--shine-px', `${(1 - x) * 100}%`);
        card.style.setProperty('--shine-py', `${(1 - y) * 100}%`);
      }
      function onEnter() { card.classList.add('is-active'); }
      function onLeave() {
        card.classList.remove('is-active');
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        // Park the shine at rest — a slight offset-from-center keeps the
        // gloss barely visible if opacity lingers during the fade-out.
        card.style.setProperty('--shine-px', '50%');
        card.style.setProperty('--shine-py', '50%');
      }

      card.addEventListener('pointerenter', onEnter);
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerleave', onLeave);
      card.addEventListener('pointercancel', onLeave);
    }

    function centeredCardRect(sourceRect) {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const maxWidth = Math.min(560, viewportWidth - (viewportWidth < 640 ? 32 : 96));
      const maxHeight = viewportHeight - (viewportWidth < 640 ? 112 : 128);
      const ratio = sourceRect.width / sourceRect.height;
      const width = Math.min(maxWidth, maxHeight * ratio);
      const height = width / ratio;
      return {
        left: (viewportWidth - width) / 2,
        top: (viewportHeight - height) / 2,
        width,
        height,
      };
    }

    function placeStage(rect, sourceRect = null) {
      modalStage.style.left = `${rect.left}px`;
      modalStage.style.top = `${rect.top}px`;
      modalStage.style.width = `${rect.width}px`;
      modalStage.style.height = `${rect.height}px`;
      if (sourceRect && !reduceMotion.matches) {
        const x = sourceRect.left - rect.left;
        const y = sourceRect.top - rect.top;
        const scaleX = sourceRect.width / rect.width;
        const scaleY = sourceRect.height / rect.height;
        modalStage.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scaleX}, ${scaleY})`;
      } else {
        modalStage.style.transform = 'translate3d(0, 0, 0) scale(1)';
      }
    }

    function scatterCards(source, target) {
      const focusX = target.left + target.width / 2;
      const focusY = target.top + target.height / 2;
      [...grid.querySelectorAll('.gallery-card')].forEach((card, index) => {
        if (card === source) return;
        const rect = card.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > window.innerHeight) return;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let dx = centerX - focusX;
        let dy = centerY - focusY;
        if (Math.hypot(dx, dy) < 4) {
          dx = Math.cos(index * 2.399963);
          dy = Math.sin(index * 2.399963);
        }
        const distance = Math.hypot(dx, dy);
        const travel = Math.min(72, Math.max(24, distance * .14));
        card.style.setProperty('--scatter-x', `${dx / distance * travel}px`);
        card.style.setProperty('--scatter-y', `${dy / distance * travel}px`);
        card.classList.add('is-scattered');
      });
    }

    function resetScatter() {
      grid.querySelectorAll('.gallery-card.is-scattered').forEach(card => {
        card.classList.remove('is-scattered');
        card.style.removeProperty('--scatter-x');
        card.style.removeProperty('--scatter-y');
      });
    }

    // ---- Spatial card viewer ----
    function openModal(entry, source) {
      if (activeSource) return;
      window.clearTimeout(closeTimer);
      activeSource = source;
      savedScrollY = window.scrollY;
      const sourceRect = source.getBoundingClientRect();
      const target = centeredCardRect(sourceRect);
      const bigCard = buildCard(entry, { isModal: true });

      modalStage.querySelectorAll('.gallery-card').forEach(node => node.remove());
      modalStage.appendChild(bigCard);
      placeStage(target, sourceRect);
      source.classList.add('is-source');
      modal.classList.remove('is-closing');
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('has-card-open');
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.position = 'fixed';
      document.body.style.left = '0';
      document.body.style.right = '0';
      scatterCards(source, target);

      if (!reduceMotion.matches) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          modalStage.style.transform = 'translate3d(0, 0, 0) scale(1)';
        }));
      }
      modalClose.focus({ preventScroll: true });
    }

    function closeModal() {
      if (!activeSource) return;
      window.clearTimeout(closeTimer);
      const source = activeSource;
      const sourceRect = source.getBoundingClientRect();
      const stageRect = modalStage.getBoundingClientRect();
      activeSource = null;
      resetScatter();
      document.body.classList.remove('has-card-open');
      modal.classList.add('is-closing');
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      if (!reduceMotion.matches) {
        const x = sourceRect.left - stageRect.left;
        const y = sourceRect.top - stageRect.top;
        const scaleX = sourceRect.width / stageRect.width;
        const scaleY = sourceRect.height / stageRect.height;
        modalStage.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scaleX}, ${scaleY})`;
      }

      const finish = () => {
        modalStage.querySelectorAll('.gallery-card').forEach(node => node.remove());
        modal.classList.remove('is-closing');
        source.classList.remove('is-source');
        document.body.style.removeProperty('position');
        document.body.style.removeProperty('top');
        document.body.style.removeProperty('left');
        document.body.style.removeProperty('right');
        window.scrollTo(0, savedScrollY);
        source.focus({ preventScroll: true });
      };
      closeTimer = window.setTimeout(finish, reduceMotion.matches ? 100 : 440);
    }
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
      if (e.key === 'Tab' && modal.classList.contains('is-open')) {
        e.preventDefault();
        modalClose.focus({ preventScroll: true });
      }
    });

    window.addEventListener('resize', () => {
      if (!activeSource) return;
      modalStage.style.transition = 'none';
      placeStage(centeredCardRect(activeSource.getBoundingClientRect()));
      requestAnimationFrame(() => modalStage.style.removeProperty('transition'));
    });

    function leaveCardLink() {
      const link = document.createElement('a');
      link.className = 'leave-card';
      link.href = '/?guestcard=open';
      link.dataset.en = 'Leave your card →';
      link.dataset.ja = 'カードを残す →';
      link.textContent = getLanguage() === 'ja' ? link.dataset.ja : link.dataset.en;
      return link;
    }

    function cardNodes() {
      return [...grid.querySelectorAll('.gallery-card')];
    }

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function showWatermelon() {
      const cards = cardNodes();
      if (!cards.length || document.querySelector('.watermelon-sticker')) return;
      const host = cards[Math.floor(cards.length * .58)];
      const sticker = document.createElement('span');
      sticker.className = 'watermelon-sticker';
      sticker.setAttribute('aria-hidden', 'true');
      sticker.textContent = '🍉';
      host.appendChild(sticker);
      requestAnimationFrame(() => sticker.classList.add('is-peeking'));
      window.setTimeout(() => sticker.classList.remove('is-peeking'), 2200);
      window.setTimeout(() => sticker.remove(), 2700);
    }

    function shuffleDeck() {
      if (activeSource) return;
      const cards = cardNodes();
      const oldRects = new Map(cards.map(card => [card, card.getBoundingClientRect()]));
      const leaveCard = grid.querySelector('.leave-card');
      shuffled(cards).forEach(card => grid.insertBefore(card, leaveCard));

      if (!reduceMotion.matches) {
        cards.forEach((card, index) => {
          const oldRect = oldRects.get(card);
          const newRect = card.getBoundingClientRect();
          card.animate([
            { transform: `translate3d(${oldRect.left - newRect.left}px, ${oldRect.top - newRect.top}px, 0)` },
            { transform: 'translate3d(0, 0, 0)' },
          ], {
            duration: 420,
            delay: Math.min(index * 18, 180),
            easing: 'cubic-bezier(0.2, 0, 0, 1)',
          });
        });
      }

      const shuffleCount = Number(sessionStorage.getItem('guestbook-shuffles') || 0) + 1;
      sessionStorage.setItem('guestbook-shuffles', String(shuffleCount));
      if (shuffleCount === 3) window.setTimeout(showWatermelon, reduceMotion.matches ? 0 : 520);
    }

    shuffleButton.addEventListener('click', shuffleDeck);

    // ---- Dummy cards for preview when Supabase is empty ----
    const DUMMY_ENTRIES = [
      { id: 101, name: 'Sarah Chen', message: 'Love the portfolio! The animations are so smooth.', card_color: '#4A90D9', pattern: 'dot-grid', created_at: '2026-04-10T14:30:00Z', signature_data: null },
      { id: 102, name: 'Marcus', message: 'Great work on the guestbook concept. Really creative!', card_color: '#E8541A', pattern: 'dash-scatter', created_at: '2026-04-11T09:15:00Z', signature_data: null },
      { id: 103, name: 'Yuki Tanaka', message: '素敵なデザイン! Beautiful design work.', card_color: '#2ECC71', pattern: 'batik-kawung', created_at: '2026-04-11T18:45:00Z', signature_data: null },
      { id: 104, name: 'Alex Rivera', message: null, card_color: '#9B59B6', pattern: 'batik-parang', created_at: '2026-04-12T07:20:00Z', signature_data: null },
      { id: 105, name: 'Emma Watson', message: 'Stopped by to say hi! Your work inspires me to build more creative UI.', card_color: '#F39C12', pattern: 'ruled', created_at: '2026-04-12T12:00:00Z', signature_data: null },
      { id: 106, name: 'Dev', message: 'The infinite canvas idea is genius.', card_color: '#1ABC9C', pattern: 'dot-grid', created_at: '2026-04-12T22:10:00Z', signature_data: null },
      { id: 107, name: 'Priya Sharma', message: 'Found your portfolio through Twitter. Keep it up!', card_color: '#E74C3C', pattern: 'dash-scatter', created_at: '2026-04-13T03:30:00Z', signature_data: null },
      { id: 108, name: 'Anonymous', message: null, card_color: '#34495E', pattern: 'batik-kawung', created_at: '2026-04-13T08:00:00Z', signature_data: null },
      { id: 109, name: 'Liam O\'Brien', message: 'Really dig the batik patterns. Nice cultural touch!', card_color: '#8E44AD', pattern: 'batik-parang', created_at: '2026-04-13T10:15:00Z', signature_data: null },
      { id: 110, name: 'Zara', message: 'Minimalist and playful at the same time.', card_color: '#F1C40F', pattern: 'ruled', created_at: '2026-04-13T11:00:00Z', signature_data: null },
      { id: 111, name: 'Hana Ito', message: 'Inspired to build my own signature portfolio after seeing this.', card_color: '#16A085', pattern: 'dot-grid', created_at: '2026-04-14T10:15:00Z', signature_data: null },
      { id: 112, name: 'Theo', message: 'The color palette choices are chef\'s kiss.', card_color: '#D35400', pattern: 'ruled', created_at: '2026-04-14T14:22:00Z', signature_data: null },
    ];

    // ---- Load entries ----
    async function loadEntries() {
      let entries = [];
      try {
        const { data, error } = await supabase
          .from('guestbook_entries')
          .select('*')
          .order('created_at', { ascending: false });
        if (!error && data && data.length > 0) entries = data;
      } catch (err) {
        console.error('[Gallery] fetch failed:', err);
      }

      if (entries.length === 0) {
        console.info('[Gallery] Using dummy entries for preview');
        entries = DUMMY_ENTRIES;
      }

      status.remove();
      entries.forEach(entry => grid.appendChild(buildCard(entry)));
      grid.appendChild(leaveCardLink());
      updateCount(entries.length);
    }

    // ---- Real-time subscription ----
    function subscribeToNew() {
      supabase
        .channel('guestbook_gallery')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guestbook_entries' }, payload => {
          const existingCards = cardNodes();
          const oldRects = new Map(existingCards.map(existingCard => [existingCard, existingCard.getBoundingClientRect()]));
          const card = buildCard(payload.new, { isNew: true });
          grid.insertBefore(card, grid.firstChild);
          if (!reduceMotion.matches) {
            existingCards.forEach(existingCard => {
              const oldRect = oldRects.get(existingCard);
              const newRect = existingCard.getBoundingClientRect();
              existingCard.animate([
                { transform: `translate3d(${oldRect.left - newRect.left}px, ${oldRect.top - newRect.top}px, 0)` },
                { transform: 'translate3d(0, 0, 0)' },
              ], { duration: 420, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
            });
          }
          updateCount(cardNodes().length);
        })
        .subscribe();
    }

    loadEntries();
    subscribeToNew();
  </script>
